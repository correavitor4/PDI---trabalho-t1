version: '3.8'

services:
  jupyter:
    build: .
    container_name: jupyter_trabalho_pdi
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      # Habilita a interface mais moderna do JupyterLab
      - JUPYTER_ENABLE_LAB=yes 
    # Define uma senha simples para facilitar o acesso local (opcional)
    command: start-notebook.sh --NotebookApp.token='trabalho123'